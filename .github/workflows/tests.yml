name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp

jobs:
  ci:
    name: ci (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: futureshift_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test!@#456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d futureshift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            coverage: pcov
            coverage-gates: 'true'
          - php-version: '8.5'
            coverage: none
            coverage-gates: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: ${{ matrix.coverage }}
          extensions: pdo_pgsql, pgsql, zip
          ini-values: max_execution_time=0, memory_limit=1024M

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Copy Testing Environment File
        run: cp .env.testing .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Prepare test database
        run: php artisan migrate:fresh --env=testing --force

      - name: Build Assets
        env:
          WAYFINDER_GENERATE: 'false'
        run: npm run build

      - name: Verify build does not dirty the worktree
        shell: bash
        run: |
          worktree_status="$(git status --porcelain)"
          if [ -z "${worktree_status}" ]; then
            exit 0
          fi

          dirty_paths="$(printf '%s\n' "${worktree_status}" | sed -n '1,30p' | tr '\n' ' ')"
          echo "::error title=Build dirtied worktree::${dirty_paths}"

          echo "::group::Build worktree status"
          printf '%s\n' "${worktree_status}"
          echo "::endgroup::"

          echo "::group::Tracked build diff stat"
          git diff --stat
          echo "::endgroup::"

          echo "::group::Untracked build output"
          git ls-files --others --exclude-standard
          echo "::endgroup::"

          echo "::group::Tracked build diff excerpt"
          git diff -- package-lock.json package.json resources/js/actions resources/js/routes | sed -n '1,240p'
          echo "::endgroup::"

          exit 1

      - name: Production SSR build
        env:
          WAYFINDER_GENERATE: 'false'
        run: npm run build:ssr:production

      - name: Verify production build keeps Wayfinder clean
        shell: bash
        run: |
          git diff --exit-code -- resources/js/actions resources/js/routes resources/js/wayfinder

      - name: Verify PHP test runtime
        shell: bash
        run: |
          max_execution_time="$(php -r 'echo ini_get("max_execution_time");')"
          echo "PHP max_execution_time=${max_execution_time}"
          test "${max_execution_time}" = "0"

      - name: Enforce PHPStan baseline debt ratchet
        shell: bash
        run: |
          set -euo pipefail
          comparison_ref="${{ github.event.before }}"
          if [ -z "${comparison_ref}" ] || [ "${comparison_ref}" = "0000000000000000000000000000000000000000" ]; then
            comparison_ref="HEAD~1"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            comparison_ref="origin/${{ github.base_ref }}"
          fi
          php scripts/assert-phpstan-baseline.php phpstan-baseline.neon "${comparison_ref}"

      - name: PHPStan level 6
        run: php vendor/bin/phpstan analyse --memory-limit=1G

      - name: Client telemetry contract tests
        run: npm run test:client-contracts

      - name: Enforce structural boundaries
        shell: bash
        run: |
          set -euo pipefail
          comparison_ref="HEAD~1"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            comparison_ref="origin/${{ github.base_ref }}"
          fi
          php scripts/assert-monolith-size.php "${comparison_ref}"
          php scripts/assert-boundary-contracts.php "${comparison_ref}"
          node scripts/assert-accessible-checkboxes.mjs "${comparison_ref}"

      - name: Enforce mass-assignment allow-lists
        shell: bash
        run: |
          set -euo pipefail
          comparison_ref="HEAD~1"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            comparison_ref="origin/${{ github.base_ref }}"
          fi
          php scripts/assert-mass-assignment.php "${comparison_ref}"

      - name: Tests
        shell: bash
        env:
          RUN_COVERAGE_GATES: ${{ matrix.coverage-gates }}
        run: |
          set -euo pipefail
          if [ "${RUN_COVERAGE_GATES}" = "true" ]; then
            php scripts/ensure-coverage-driver.php
            php -d memory_limit=1024M vendor/phpunit/phpunit/phpunit --log-junit storage/logs/phpunit.xml --coverage-clover storage/logs/clover.xml 2>&1 | tee storage/logs/phpunit-console.log
            php scripts/assert-coverage-thresholds.php storage/logs/clover.xml storage/logs/coverage-summary.json
            comparison_ref="HEAD~1"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              comparison_ref="origin/${{ github.base_ref }}"
            fi
            php scripts/assert-coverage-regression.php storage/logs/coverage-summary.json quality/coverage-baseline.json "${comparison_ref}"
          else
            php -d memory_limit=1024M vendor/phpunit/phpunit/phpunit --log-junit storage/logs/phpunit.xml --no-coverage 2>&1 | tee storage/logs/phpunit-console.log
          fi

      - name: Upload Clover coverage report
        if: ${{ always() && matrix.coverage-gates == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: clover-php-${{ matrix.php-version }}
          path: |
            storage/logs/clover.xml
            storage/logs/coverage-summary.json
          if-no-files-found: warn

      - name: Publish coverage summary
        if: ${{ always() && matrix.coverage-gates == 'true' }}
        shell: bash
        run: |
          if [ ! -f storage/logs/coverage-summary.json ]; then
            echo "Coverage summary was not produced."
            exit 0
          fi

          {
            echo "### PHP coverage contract"
            echo '```json'
            cat storage/logs/coverage-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report PHPUnit failures
        if: failure()
        run: php scripts/report-phpunit-failures.php storage/logs/phpunit.xml
