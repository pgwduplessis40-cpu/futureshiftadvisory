name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: futureshift_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test!@#456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d futureshift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug
          extensions: pdo_pgsql, pgsql
          ini-values: max_execution_time=0, memory_limit=1024M

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Copy Testing Environment File
        run: cp .env.testing .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Prepare test database
        run: php artisan migrate:fresh --env=testing --force

      - name: Build Assets
        run: npm run build

      - name: Verify PHP test runtime
        shell: bash
        run: |
          max_execution_time="$(php -r 'echo ini_get("max_execution_time");')"
          echo "PHP max_execution_time=${max_execution_time}"
          test "${max_execution_time}" = "0"

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          php vendor/phpunit/phpunit/phpunit --log-junit storage/logs/phpunit.xml 2>&1 | tee storage/logs/phpunit-console.log

      - name: Report PHPUnit failures
        if: failure()
        run: php scripts/report-phpunit-failures.php storage/logs/phpunit.xml
