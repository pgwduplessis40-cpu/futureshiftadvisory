name: release version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: release-version-main
      cancel-in-progress: true

    steps:
      - name: Require successful source checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          required_checks=("quality" "ci (8.4)" "ci (8.5)" "authenticated-browser-e2e")
          check_sha="$SOURCE_SHA"

          for attempt in {1..180}; do
            if ! checks="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/commits/${check_sha}/check-runs?per_page=100")"; then
              echo "Unable to read source checks on attempt ${attempt}; retrying."
              sleep 10
              continue
            fi
            pending=no

            for check_name in "${required_checks[@]}"; do
              status="$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | if length == 0 then "" else (sort_by(.started_at) | .[-1].status) end
              ' <<< "$checks")"
              conclusion="$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | if length == 0 then "" else (sort_by(.started_at) | .[-1].conclusion) end
              ' <<< "$checks")"

              if [ "$status" != "completed" ]; then
                echo "Waiting for ${check_name} (${status:-not started})."
                pending=yes
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "ERROR: ${check_name} concluded ${conclusion:-without a result}." >&2
                exit 1
              fi
            done

            if [ "$pending" = "no" ]; then
              echo "All required source checks passed for ${SOURCE_SHA}."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: timed out waiting for required source checks." >&2
          exit 1

  tag-release:
    needs: wait-for-ci
    runs-on: ubuntu-latest

    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm source is still main head
        id: current-head
        shell: bash
        run: |
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Release source ${GITHUB_SHA} has been superseded by $(git rev-parse origin/main); skipping release tag."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Determine next release tag
        id: version
        if: ${{ steps.current-head.outputs.release_ready == 'true' }}
        shell: bash
        run: |
          baseline_version="$(tr -d '\r\n' < VERSION)"

          if [[ ! "$baseline_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use major.minor.patch format; found '$baseline_version'." >&2
            exit 1
          fi

          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)

          latest_version="${latest_tag#v}"
          highest_version="$baseline_version"
          if [ -n "$latest_tag" ]; then
            highest_version="$(printf '%s\n%s\n' "$baseline_version" "$latest_version" | sort -V | tail -n 1)"
          fi

          IFS='.' read -r major minor patch <<< "$highest_version"
          next_version="$major.$minor.$((patch + 1))"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        id: release
        if: ${{ steps.current-head.outputs.release_ready == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Release source ${GITHUB_SHA} has been superseded by $(git rev-parse origin/main); skipping release tag."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "ERROR: ${tag} already points to ${tagged_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi

            echo "Reusing existing release tag ${tag}."
          else
            git tag --annotate "$tag" "$GITHUB_SHA" --message "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi

          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: tag-release
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' && needs.tag-release.outputs.commit != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag-release.outputs.commit }}
          fetch-depth: 0

      - name: Create deployment Git bundle
        env:
          DEPLOY_COMMIT: ${{ needs.tag-release.outputs.commit }}
          DEPLOY_VERSION: ${{ needs.tag-release.outputs.version }}
        run: |
          bundle_path="$RUNNER_TEMP/futureshiftadvisory-${DEPLOY_COMMIT}.bundle"
          git fetch --tags origin
          git rev-parse --verify "$DEPLOY_COMMIT^{commit}"
          git rev-parse --verify "refs/tags/v${DEPLOY_VERSION}"
          git bundle create "$bundle_path" "$DEPLOY_COMMIT" "refs/tags/v${DEPLOY_VERSION}"
          git bundle verify "$bundle_path"
          echo "DEPLOY_BUNDLE=$bundle_path" >> "$GITHUB_ENV"

      - name: Configure deployment SSH access
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          for value in DEPLOY_HOST DEPLOY_PORT DEPLOY_PRIVATE_KEY DEPLOY_KNOWN_HOSTS DEPLOY_USER; do
            if [ -z "${!value}" ]; then
              echo "Missing production deployment secret: ${value}" >&2
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment Git bundle
        env:
          DEPLOY_COMMIT: ${{ needs.tag-release.outputs.commit }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_APP_PATH }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing production deployment secret: DEPLOY_PATH" >&2; exit 1; }
          test -n "${DEPLOY_BUNDLE:-}" || { echo "Deployment bundle was not created." >&2; exit 1; }

          remote_bundle="/tmp/futureshiftadvisory-${DEPLOY_COMMIT}.bundle"
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" "$DEPLOY_BUNDLE" "$DEPLOY_USER@$DEPLOY_HOST:$remote_bundle"
          echo "DEPLOY_REMOTE_BUNDLE=$remote_bundle" >> "$GITHUB_ENV"

      - name: Deploy the released commit
        env:
          DEPLOY_COMMIT: ${{ needs.tag-release.outputs.commit }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_APP_PATH }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_VERSION: ${{ needs.tag-release.outputs.version }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing production deployment secret: DEPLOY_PATH" >&2; exit 1; }
          test -n "$DEPLOY_REMOTE_BUNDLE" || { echo "Deployment bundle was not uploaded." >&2; exit 1; }
          # An older deploy can leave its own script or generated Wayfinder
          # helpers dirty before the checkout has pulled the self-healing deploy
          # script. Reset only those deployment-managed paths, fast-forward to
          # the exact released commit from the uploaded Git bundle, and then
          # execute that release's deploy.sh.
          deploy_log="$RUNNER_TEMP/production-deploy.log"
          set +e
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_COMMIT='$DEPLOY_COMMIT' DEPLOY_REMOTE_BUNDLE='$DEPLOY_REMOTE_BUNDLE' DEPLOY_VERSION='$DEPLOY_VERSION' bash -s" <<'REMOTE_DEPLOY' \
            2>&1 | tee "$deploy_log"
          set -euo pipefail

          cd "$DEPLOY_PATH"

          cleanup_bundle() {
            rm -f -- "$DEPLOY_REMOTE_BUNDLE"
          }
          trap cleanup_bundle EXIT

          if [ -e .git/index.lock ]; then
            command -v pgrep >/dev/null 2>&1 || { echo 'Cannot verify stale Git lock ownership because pgrep is unavailable.' >&2; exit 1; }
            if pgrep -x git >/dev/null 2>&1; then
              echo 'A Git process is running; refusing to remove .git/index.lock.' >&2
              exit 1
            fi
            echo 'Removing orphaned .git/index.lock.'
            rm -f -- .git/index.lock
          fi

          git restore --worktree --source=HEAD -- deploy.sh resources/js/actions resources/js/routes
          git clean -fd -- resources/js/actions resources/js/routes
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Deployment checkout is dirty before release bootstrap.' >&2
            git status --short
            exit 1
          fi

          git fetch "$DEPLOY_REMOTE_BUNDLE" "$DEPLOY_COMMIT"
          git fetch "$DEPLOY_REMOTE_BUNDLE" "refs/tags/v${DEPLOY_VERSION}:refs/tags/v${DEPLOY_VERSION}"
          git merge --ff-only "$DEPLOY_COMMIT"
          test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"
          chmod 755 deploy.sh
          DEPLOY_SKIP_GIT_PULL=yes DEPLOY_EXPECTED_COMMIT="$DEPLOY_COMMIT" DEPLOY_EXPECTED_VERSION="$DEPLOY_VERSION" bash ./deploy.sh
          REMOTE_DEPLOY
          deploy_exit="${PIPESTATUS[0]}"
          set -e

          if [ "$deploy_exit" -ne 0 ]; then
            deploy_tail="$(tail -n 40 "$deploy_log")"
            deploy_tail="${deploy_tail//'%'/'%25'}"
            deploy_tail="${deploy_tail//$'\r'/'%0D'}"
            deploy_tail="${deploy_tail//$'\n'/'%0A'}"
            echo "::error title=Production deployment failed::$deploy_tail"
            exit "$deploy_exit"
          fi

      - name: Verify the live release identity
        env:
          DEPLOY_COMMIT: ${{ needs.tag-release.outputs.commit }}
          DEPLOY_URL: ${{ secrets.PRODUCTION_URL }}
          DEPLOY_VERSION: ${{ needs.tag-release.outputs.version }}
        run: |
          test -n "$DEPLOY_URL" || { echo "Missing production deployment secret: PRODUCTION_URL" >&2; exit 1; }
          payload="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$DEPLOY_URL/api/deployment")"
          echo "$payload" | jq -e \
            --arg commit "$DEPLOY_COMMIT" \
            --arg version "$DEPLOY_VERSION" \
            '.status == "verified" and .commit == $commit and .version == $version and (.client_manifest_sha256 | length == 64) and (.ssr_manifest_sha256 | length == 64)'

      - name: Verify public availability after release
        env:
          EXPECTED_COMMIT: ${{ needs.tag-release.outputs.commit }}
          EXPECTED_VERSION: ${{ needs.tag-release.outputs.version }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: bash scripts/probe-production-availability.sh
