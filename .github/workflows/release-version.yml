name: release version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: read

jobs:
  wait-for-ci:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: release-version-main
      cancel-in-progress: true

    steps:
      - name: Require successful source checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          required_checks=("quality" "ci (8.4)" "ci (8.5)")
          source_commit="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/commits/${SOURCE_SHA}")"
          check_sha="$SOURCE_SHA"

          if [[ "$(jq -r '.commit.message' <<< "$source_commit")" == *"[skip release]"* ]]; then
            check_sha="$(jq -r '.parents[0].sha // empty' <<< "$source_commit")"

            if [ -z "$check_sha" ]; then
              echo "Unable to resolve the source commit for the release-version bump." >&2
              exit 1
            fi

            echo "Using source commit ${check_sha} for checks behind automated version bump ${SOURCE_SHA}."
          fi

          for attempt in {1..180}; do
            if ! checks="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${REPOSITORY}/commits/${check_sha}/check-runs?per_page=100")"; then
              echo "Unable to read source checks on attempt ${attempt}; retrying."
              sleep 10
              continue
            fi
            pending=no

            for check_name in "${required_checks[@]}"; do
              status="$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | if length == 0 then "" else (sort_by(.started_at) | .[-1].status) end
              ' <<< "$checks")"
              conclusion="$(jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | if length == 0 then "" else (sort_by(.started_at) | .[-1].conclusion) end
              ' <<< "$checks")"

              if [ "$status" != "completed" ]; then
                echo "Waiting for ${check_name} (${status:-not started})."
                pending=yes
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "ERROR: ${check_name} concluded ${conclusion:-without a result}." >&2
                exit 1
              fi
            done

            if [ "$pending" = "no" ]; then
              echo "All required source checks passed for ${SOURCE_SHA}."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: timed out waiting for required source checks." >&2
          exit 1

  bump-patch-version:
    needs: wait-for-ci
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest

    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm source is still main head
        id: current-head
        shell: bash
        run: |
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Release source ${GITHUB_SHA} has been superseded by $(git rev-parse origin/main); skipping version bump."
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Increment patch version
        id: version
        if: ${{ steps.current-head.outputs.release_ready == 'true' }}
        shell: bash
        run: |
          current_version="$(tr -d '\r\n' < VERSION)"

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use major.minor.patch format; found '$current_version'." >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          next_version="$major.$minor.$((patch + 1))"
          printf '%s\n' "$next_version" > VERSION
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        id: release
        if: ${{ steps.current-head.outputs.release_ready == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v${VERSION} [skip release]"

          if ! git push origin HEAD:main; then
            echo "main advanced before the release version could be published; a newer source workflow will release it."
            exit 0
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: bump-patch-version
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' && needs.bump-patch-version.outputs.commit != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Configure deployment SSH access
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          for value in DEPLOY_HOST DEPLOY_PORT DEPLOY_PRIVATE_KEY DEPLOY_KNOWN_HOSTS DEPLOY_USER; do
            if [ -z "${!value}" ]; then
              echo "Missing production deployment secret: ${value}" >&2
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the released commit
        env:
          DEPLOY_COMMIT: ${{ needs.bump-patch-version.outputs.commit }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_APP_PATH }}
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_VERSION: ${{ needs.bump-patch-version.outputs.version }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing production deployment secret: DEPLOY_PATH" >&2; exit 1; }
          # An older deploy can leave its own script or generated Wayfinder
          # helpers dirty before the checkout has pulled the self-healing deploy
          # script. Reset only those deployment-managed paths, fast-forward to
          # the exact released commit, and then execute that release's deploy.sh.
          deploy_log="$RUNNER_TEMP/production-deploy.log"
          set +e
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && if [ -e .git/index.lock ]; then command -v pgrep >/dev/null 2>&1 || { echo 'Cannot verify stale Git lock ownership because pgrep is unavailable.' >&2; exit 1; }; if pgrep -x git >/dev/null 2>&1; then echo 'A Git process is running; refusing to remove .git/index.lock.' >&2; exit 1; fi; echo 'Removing orphaned .git/index.lock.'; rm -f -- .git/index.lock; fi && git restore --worktree --source=HEAD -- deploy.sh resources/js/actions resources/js/routes && git clean -fd -- resources/js/actions resources/js/routes && if [ -n \"\$(git status --porcelain)\" ]; then echo 'Deployment checkout is dirty before release bootstrap.' >&2; git status --short; exit 1; fi && git fetch origin main && git merge --ff-only '$DEPLOY_COMMIT' && test \"\$(git rev-parse HEAD)\" = '$DEPLOY_COMMIT' && chmod 755 deploy.sh && DEPLOY_EXPECTED_COMMIT='$DEPLOY_COMMIT' DEPLOY_EXPECTED_VERSION='$DEPLOY_VERSION' bash ./deploy.sh" \
            2>&1 | tee "$deploy_log"
          deploy_exit="${PIPESTATUS[0]}"
          set -e

          if [ "$deploy_exit" -ne 0 ]; then
            deploy_tail="$(tail -n 40 "$deploy_log")"
            deploy_tail="${deploy_tail//'%'/'%25'}"
            deploy_tail="${deploy_tail//$'\r'/'%0D'}"
            deploy_tail="${deploy_tail//$'\n'/'%0A'}"
            echo "::error title=Production deployment failed::$deploy_tail"
            exit "$deploy_exit"
          fi

      - name: Verify the live release identity
        env:
          DEPLOY_COMMIT: ${{ needs.bump-patch-version.outputs.commit }}
          DEPLOY_URL: ${{ secrets.PRODUCTION_URL }}
          DEPLOY_VERSION: ${{ needs.bump-patch-version.outputs.version }}
        run: |
          test -n "$DEPLOY_URL" || { echo "Missing production deployment secret: PRODUCTION_URL" >&2; exit 1; }
          payload="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$DEPLOY_URL/api/deployment")"
          echo "$payload" | jq -e \
            --arg commit "$DEPLOY_COMMIT" \
            --arg version "$DEPLOY_VERSION" \
            '.status == "verified" and .commit == $commit and .version == $version and (.client_manifest_sha256 | length == 64) and (.ssr_manifest_sha256 | length == 64)'
