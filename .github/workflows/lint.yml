name: linter

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - featureApp

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Each step below FAILS the build on a violation (check, not auto-fix).
      - name: Pint (PHP style)
        run: composer lint:check

      - name: Prettier (format)
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript (tsc --noEmit)
        run: npm run types:check

      - name: Deployment SSH transport regression
        run: node scripts/check-release-ssh-transport.mjs

      - name: Install Chrome for Puppeteer
        run: npx --no-install puppeteer browsers install chrome

      - name: Idea Validation editor browser regression
        run: npm run test:idea-validation-editor
