name: operational health schedule

on:
  schedule:
    # Covers New Zealand business-hour app-check slots in both NZST and NZDT.
    # The Laravel command decides whether a Pacific/Auckland slot is actually due.
    - cron: '15,45 18-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-health-schedule
  cancel-in-progress: false

jobs:
  run-due-operational-health-checks:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure production SSH access
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          for value in DEPLOY_HOST DEPLOY_PORT DEPLOY_PRIVATE_KEY DEPLOY_KNOWN_HOSTS DEPLOY_USER; do
            if [ -z "${!value}" ]; then
              echo "Missing production deployment secret: ${value}" >&2
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run due operational health checks
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_APP_PATH }}
          DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing production deployment secret: DEPLOY_PATH" >&2; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && php artisan fsa:operational-health-check:due --ensure-fixtures --no-interaction"
