name: production availability monitor

on:
  schedule:
    # GitHub schedule is an independent public-edge backstop. A dedicated
    # uptime provider remains the required sub-five-minute alerting path.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-monitor
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate required monitor configuration
        env:
          MONITOR_ENABLED: ${{ vars.PRODUCTION_AVAILABILITY_MONITOR_ENABLED }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ "$MONITOR_ENABLED" != "true" ]; then
            echo "::error title=Production availability monitor disabled::Set the repository Actions variable PRODUCTION_AVAILABILITY_MONITOR_ENABLED to exactly true. Scheduled probes must not silently skip."
            exit 1
          fi

          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error title=Production availability monitor missing URL::Set the repository Actions secret PRODUCTION_URL before enabling the monitor."
            exit 1
          fi

  probe:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Probe production from the public edge
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: bash scripts/probe-production-availability.sh

  notify-failure:
    needs: [preflight, probe]
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.probe.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Publish availability incident
        env:
          ALERT_WEBHOOK: ${{ secrets.PRODUCTION_AVAILABILITY_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message="Production availability probe failed. Clients may be unable to use FutureShift Advisory. Investigate: ${RUN_URL}"
          echo "::error title=Production availability incident::${message}"

          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "No PRODUCTION_AVAILABILITY_ALERT_WEBHOOK is configured; the failed Actions run is the incident signal."
            exit 0
          fi

          payload="$(jq -n --arg text "$message" '{text: $text}')"
          curl --fail --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$ALERT_WEBHOOK"
